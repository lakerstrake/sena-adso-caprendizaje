name: Sincronización Automática SENA Caprendizaje

on:
  schedule:
    # Ejecuta automáticamente dos veces al día: 06:00 UTC (01:00 AM Colombia) y 18:00 UTC (01:00 PM Colombia)
    - cron: '0 6,18 * * 1-5'
  workflow_dispatch: # Permite ejecución manual desde GitHub con 1 clic

jobs:
  sync:
    name: Sincronizar Vacantes Oficiales SGVA SENA
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependencias del Pipeline
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas urllib3

      - name: Ejecutar Pipeline de Sincronización SENA
        env:
          SENA_USER: ${{ secrets.SENA_USER }}
          SENA_PASSWORD: ${{ secrets.SENA_PASSWORD }}
        run: |
          python scripts/sync_sena.py

      - name: Verificar si hay cambios en los datos
        id: check_changes
        run: |
          git diff --quiet output/assets/data/empresas.json output/assets/js/data.js || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Hacer Commit y Push de los Nuevos Datos
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/assets/data/empresas.json output/assets/js/data.js
          git commit -m "chore(data): auto-sync SENA Caprendizaje vacancies [$(date +'%Y-%m-%d %H:%M')]"
          git push origin main
