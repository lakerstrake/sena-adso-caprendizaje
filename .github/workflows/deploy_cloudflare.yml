name: Despliegue en Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Compilar y Desplegar en Cloudflare
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v5

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependencias
        run: pip install -r requirements.txt

      # build.py valida el dataset y devuelve != 0 si detecta corrupcion,
      # de modo que un dataset roto detiene el despliegue en este punto.
      - name: Validar Dataset y Recompilar data.js
        run: python scripts/build.py

      # Sin el secreto, cloudflare/wrangler-action falla con un mensaje opaco
      # ("Input required and not supplied"). Este paso explica que falta.
      - name: Verificar Credenciales de Cloudflare
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Faltan los secretos CLOUDFLARE_API_TOKEN y/o CLOUDFLARE_ACCOUNT_ID."
            echo "::error::Configuralos en Settings > Secrets and variables > Actions del repositorio."
            echo "::error::El token necesita el permiso 'Cloudflare Pages: Edit'."
            exit 1
          fi

      - name: Desplegar a Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy output --project-name=sena-adso-caprendizaje --branch=main
