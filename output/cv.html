    <script>
        (function() {
            const DRIVE_URL = "https://drive.google.com/drive/folders/1BZ-qBNdPeYsxW84zIq_ls97UkPlQcHyN";
            
            try {
                // Parse tracking telemetry params
                const params = new URLSearchParams(window.location.search);
                const empresa = params.get('empresa') || params.get('e') || 'Reclutador Externo';
                const id = params.get('id') || 'N/A';
                const contacto = params.get('c') || params.get('contacto') || 'Equipo de Selección';
                const src = params.get('src') || 'Web Link';

                // Local storage alert registration
                const alertItem = {
                    id: 'cv_' + Date.now(),
                    empresa: empresa,
                    contacto: contacto,
                    solicitudId: id,
                    source: src,
                    fecha: new Date().toLocaleString('es-CO', { timeZone: 'America/Bogota' }),
                    timestamp: Date.now()
                };

                const storedAlerts = JSON.parse(localStorage.getItem('sgva_cv_alerts_store') || '[]');
                storedAlerts.unshift(alertItem);
                if (storedAlerts.length > 50) storedAlerts.pop();
                localStorage.setItem('sgva_cv_alerts_store', JSON.stringify(storedAlerts));

                // Optional telemetry ping
                if (navigator.sendBeacon) {
                    const data = new Blob([JSON.stringify(alertItem)], { type: 'application/json' });
                    navigator.sendBeacon('/api/cv-events', data);
                } else {
                    fetch('/api/cv-events', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(alertItem),
                        keepalive: true
                    }).catch(function() {});
                }
            } catch (err) {
                console.warn('[CV Tracker]', err);
            }

            // Smooth redirect to Google Drive
            setTimeout(function() {
                window.location.replace(DRIVE_URL);
            }, 800);
        })();
    </script>
